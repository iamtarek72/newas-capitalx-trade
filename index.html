    <script type="text/javascript">
      // GitHub Pages SPA single page router redirect handler
      (function() {
        var search = window.location.search;
        if (search) {
          var params = new URLSearchParams(search);
          var redirectedPath = params.get('p');
          if (redirectedPath) {
            var cleanPath = decodeURIComponent(redirectedPath).replace(/^\//, '');
            if (cleanPath) {
              window.location.hash = '/' + cleanPath;
            }
            params.delete('p');
            var remaining = params.toString();
            var newUrl = window.location.pathname + (remaining ? '?' + remaining : '') + window.location.hash;
            window.history.replaceState(null, '', newUrl);
          }
        }
      })();
    </script>

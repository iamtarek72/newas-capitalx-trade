<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>NEWAZ CAPITALX — Redirecting</title>
    <script type="text/javascript">
      // Single Page Application (SPA) redirect script for GitHub Pages
      // Mitigates 404 on page reload by capturing path and query, then redirecting to index.html with query parameters
      (function() {
        var pathSegmentsToKeep = 1; // Set to 1 if hosted on https://<username>.github.io/<repo-name>/, or 0 if on custom domain
        
        var location = window.location;
        var pathname = location.pathname;
        var origin = location.origin;
        var search = location.search;
        var hash = location.hash;

        // Extract segment parts
        var segments = pathname.split('/').filter(Boolean);
        
        // If hosted on username.github.io/repo/, the first segment is the repo name
        // We preserve the repo root if needed
        var repoPrefix = '';
        if (location.hostname.endsWith('github.io') && segments.length > 0) {
          repoPrefix = '/' + segments[0];
          segments = segments.slice(1);
        }

        var redirectPath = segments.join('/');
        var targetUrl = origin + repoPrefix + '/?' + 
          (redirectPath ? 'p=/' + encodeURIComponent(redirectPath) : '') + 
          (search ? '&q=' + encodeURIComponent(search.slice(1)) : '') + 
          hash;

        location.replace(targetUrl);
      })();
    </script>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #0b0e14;
        color: #94a3b8;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
      }
      .spinner {
        width: 36px;
        height: 36px;
        border: 3px solid rgba(16, 185, 129, 0.2);
        border-top-color: #10b981;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-bottom: 16px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      h2 {
        font-size: 1.1rem;
        font-weight: 600;
        color: #f1f5f9;
        margin: 0 0 6px 0;
      }
      p {
        font-size: 0.85rem;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div class="spinner"></div>
    <h2>Redirecting to NEWAZ CAPITALX...</h2>
    <p>Restoring terminal workspace route</p>
  </body>
</html>

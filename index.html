    <script type="text/javascript">
      // GitHub Pages SPA single page router & trailing slash normalizer
      (function() {
        var loc = window.location;
        // Fix: If hosted on GitHub Pages and accessed without trailing slash (e.g. /repo instead of /repo/),
        // browser resolves relative assets (./assets/...) incorrectly against root domain.
        if (loc.hostname.endsWith('github.io')) {
          var segments = loc.pathname.split('/').filter(Boolean);
          if (segments.length === 1 && !loc.pathname.endsWith('/')) {
            window.location.replace(loc.origin + '/' + segments[0] + '/' + loc.search + loc.hash);
            return;
          }
        }

        var search = loc.search;
        if (search) {
          var params = new URLSearchParams(search);
          var redirectedPath = params.get('p');
          if (redirectedPath) {
            var cleanPath = decodeURIComponent(redirectedPath).replace(/^\//, '');
            if (cleanPath) {
              window.location.hash = '/' + cleanPath;
            }
            params.delete('p');
            var remaining = params.toString();
            var newUrl = loc.pathname + (remaining ? '?' + remaining : '') + loc.hash;
            window.history.replaceState(null, '', newUrl);
          }
        }
      })();
    </script>
    <link rel="stylesheet" href="./assets/style.css">

  <body class="bg-[#0b0e14] text-slate-100 antialiased selection:bg-emerald-500/30 selection:text-emerald-300">
    <div id="root"></div>
    <script>
      // Automatically load pre-compiled production bundle on GitHub Pages or static hosts
      (function() {
        var isLocal = window.location.hostname === 'localhost' || 
                      window.location.hostname === '127.0.0.1' || 
                      window.location.hostname.includes('run.app');
        if (!isLocal) {
          var script = document.createElement('script');
          script.type = 'module';
          script.crossOrigin = 'anonymous';
          script.src = './assets/app.js';
          document.body.appendChild(script);
        }

        // Register Progressive Web App Service Worker
        if ('serviceWorker' in navigator) {
          window.addEventListener('load', function() {
            navigator.serviceWorker.register('./sw.js').catch(function(err) {
              console.log('SW registration error:', err);
            });
          });
        }
      })();
    </script>
    <script type="module">
      // Only run raw TSX source in Vite development mode
      if (window.location.hostname === 'localhost' || 
          window.location.hostname === '127.0.0.1' || 
          window.location.hostname.includes('run.app')) {
        import('/src/main.tsx');
      }
    </script>
